<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos e Estágios — SisDoc</title>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sisdoc.css">
</head>
<body class="min-h-screen flex flex-col">

  <header class="timbre text-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-[68px]">
      <div class="flex items-center gap-3">
        <i data-lucide="shield" class="w-7 h-7" style="color: var(--dourado-300);"></i>
        <div class="flex flex-col justify-center leading-tight">
          <span class="timbre-unidade uppercase">5º Batalhão de Infantaria Aeromóvel · Regimento Itororó</span>
          <h1 class="timbre-sistema text-base sm:text-lg">SisDoc — Geração de Documentos</h1>
        </div>
      </div>
      <a href="index.html" class="timbre-voltar">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Painel
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <div class="painel-form">

      <div class="painel-form-cabecalho">
        <i data-lucide="graduation-cap" class="w-6 h-6" style="color: var(--dourado-300);"></i>
        <div>
          <h2 class="fonte-titulo text-xl font-medium">Cursos e Estágios</h2>
          <p class="text-sm mt-0.5" style="color: var(--dourado-200);">Aperfeiçoamento ou especialização — preencha os dados abaixo</p>
        </div>
      </div>

      <form id="form-cursos" class="p-6 sm:p-8 space-y-5">

        <!-- TIPO DE SOLICITAÇÃO -->
        <div class="faixa-aviso">
          <label class="flex items-center gap-2.5 cursor-pointer font-bold text-sm" style="color: var(--dourado-700);">
            <input type="checkbox" id="chk_is_complemento" class="w-4 h-4" style="accent-color: var(--oliva-700);" onchange="toggleMotivoComplemento()">
            Esta é uma solicitação de COMPLEMENTO DE INDENIZAÇÃO
          </label>
          <div id="box_motivo_complemento" class="mt-3 hidden">
            <label class="rotulo">Motivo do Complemento *</label>
            <input type="text" id="motivo_complemento" placeholder="Ex: DEPENDENTE QUE NÃO HAVIA SIDO INCLUÍDO ANTERIORMENTE" class="campo uppercase-input">
          </div>
        </div>

        <!-- 1. IDENTIFICAÇÃO -->
        <div class="secao-form">
          <h3 class="secao-titulo"><span class="secao-numero">1</span> Identificação</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="lg:col-span-1">
              <label class="rotulo rotulo-obrigatorio">Posto/Graduação</label>
              <select id="posto" required class="campo-select">
                <option value="">Selecione...</option>
                <option value="Ten Cel">Ten Cel</option>
                <option value="Maj">Maj</option>
                <option value="Cap">Cap</option>
                <option value="1º Ten">1º Ten</option>
                <option value="2º Ten">2º Ten</option>
                <option value="Asp">Asp</option>
                <option value="S Ten">S Ten</option>
                <option value="1º Sgt">1º Sgt</option>
                <option value="2º Sgt">2º Sgt</option>
                <option value="3º Sgt">3º Sgt</option>
                <option value="Cb">Cb</option>
                <option value="Sd">Sd</option>
              </select>
            </div>
            <div class="sm:col-span-1 lg:col-span-3">
              <label class="rotulo rotulo-obrigatorio">Nome Completo</label>
              <input type="text" id="nome" placeholder="Fulano de Tal"  required class="campo uppercase-input">
            </div>
            <div><label class="rotulo rotulo-obrigatorio">CPF</label><input type="text" id="cpf" placeholder="Ex: 000.000.000-00" required class="campo"></div>
            <div><label class="rotulo rotulo-obrigatorio">Identidade</label><input type="text" id="idt" placeholder="000.000.000-0" required class="campo"></div>
            <div><label class="rotulo rotulo-obrigatorio">Prec CP</label><input type="text" id="preccp" placeholder="00.000.000-0" required class="campo"></div>
            <div><label class="rotulo rotulo-obrigatorio">Telefone</label><input type="text" id="telefone" placeholder="(00) 0 0000-0000" required class="campo"></div>
          </div>
        </div>

        <!-- 2. DADOS DO CURSO -->
        <div class="secao-form">
          <h3 class="secao-titulo"><span class="secao-numero">2</span> Curso e Destino</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2"><label class="rotulo rotulo-obrigatorio">Nome do Curso</label><input type="text" id="curso" placeholder="Ex. Curso de Aperfeiçoemento de Sargentos "required class="campo uppercase-input"></div>
            <div><label class="rotulo rotulo-obrigatorio">OM de Realização</label><input type="text" id="omCurso" placeholder="Ex. EASA"required class="campo uppercase-input"></div>
            <div><label class="rotulo rotulo-obrigatorio">Guarnição</label><input type="text" id="guarnicaoCurso" placeholder="Ex. Cruz Alta - RS" required class="campo uppercase-input"></div>
            <div><label class="rotulo rotulo-obrigatorio">Adt DCEM</label><input type="text" id="adtDcem" placeholder="Ex: Adt DCEM 1A ao Bol DGP n° 000" required class="campo"></div>
            <div><label class="rotulo rotulo-obrigatorio">Previsão de Desligamento</label><input type="text" id="dataDesligamento" placeholder="00 de mes de 0000"required class="campo"></div>
          </div>
        </div>

        <!-- 3. BANCÁRIOS E DEPENDENTES -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="secao-form">
            <h3 class="secao-titulo"><span class="secao-numero">3</span> Dados Bancários</h3>
            <div class="space-y-3">
              <div><label class="rotulo rotulo-obrigatorio">Banco</label><input type="text" id="banco" placeholder="Ex:001 - Banco do Brasil" required class="campo"></div>
              <div class="flex gap-3">
                <div class="flex-1"><label class="rotulo rotulo-obrigatorio">Agência</label><input type="text" id="agencia" placeholder="Ex: 000-0"required class="campo"></div>
                <div class="flex-1"><label class="rotulo rotulo-obrigatorio">Conta</label><input type="text" id="conta" placeholder="Ex:00-00" required class="campo"></div>
              </div>
            </div>
          </div>

          <div class="secao-form">
            <h3 class="secao-titulo"><span class="secao-numero">4</span> Dependentes</h3>
            <span class="rotulo mb-2">Possui dependentes?</span>
            <div class="flex gap-3 mb-4">
              <label class="opcao-pilula">
                <input type="radio" id="opt_dep_sim" name="opt_dependentes" value="sim" onchange="toggleDependentes('sim')">
                <span>SIM</span>
              </label>
              <label class="opcao-pilula">
                <input type="radio" id="opt_dep_nao" name="opt_dependentes" value="nao" checked onchange="toggleDependentes('nao')">
                <span>NÃO</span>
              </label>
            </div>
            <div id="caixa-inclusao-dependentes" class="hidden">
              <button type="button" id="btn-add-dep" class="btn-secundario text-xs w-full mb-3">+ Adicionar Dependente</button>
              <div id="lista-dependentes" class="space-y-3"></div>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-primario w-full text-base">
          <i data-lucide="check-circle" class="w-5 h-5"></i> Gerar Documentos (Curso)
        </button>
      </form>
    </div>
  </main>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
    function toggleDependentes(opcao) {
      document.getElementById('caixa-inclusao-dependentes').style.display = (opcao === 'sim') ? 'block' : 'none';
    }
    function toggleMotivoComplemento() {
      const isChecked = document.getElementById('chk_is_complemento').checked;
      const box = document.getElementById('box_motivo_complemento');
      const input = document.getElementById('motivo_complemento');
      box.style.display = isChecked ? 'block' : 'none';
      if(isChecked) input.setAttribute('required', 'required');
      else input.removeAttribute('required');
    }
  </script>
  <script src="./js/gerador-cursos.js"></script>
</body>
</html>
