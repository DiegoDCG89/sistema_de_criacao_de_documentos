<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos e Estágios - SisDoc</title>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #eae6dd; }
    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

  <header class="bg-[#2c3b2c] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <i data-lucide="shield" class="w-8 h-8 text-[#c6b075]"></i>
        <div class="flex flex-col justify-center">
          <span class="text-[10px] text-[#a0a89d] uppercase tracking-wider mb-[2px]">5º BIL - SisDoc</span>
          <h1 class="text-base sm:text-lg font-bold tracking-wide text-white leading-none">Cursos e Estágios</h1>
        </div>
      </div>
      <a href="index.html" class="p-2 bg-[#1a241a] border border-[#445646] rounded hover:bg-[#3b4d3d] transition flex items-center gap-1 text-sm font-semibold text-[#c6b075]">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <div class="bg-[#fbfaf6] rounded-xl shadow-lg border border-[#dcd3b6] overflow-hidden">
      <form id="form-cursos" class="p-6 sm:p-8 space-y-6">
        
        <!-- TIPO DE SOLICITAÇÃO -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 shadow-sm">
          <label class="flex items-center gap-2 cursor-pointer font-bold text-amber-900">
            <input type="checkbox" id="chk_is_complemento" class="w-5 h-5 text-amber-600 focus:ring-amber-500 rounded border-amber-300" onchange="toggleMotivoComplemento()">
            Esta é uma solicitação de COMPLEMENTO DE INDENIZAÇÃO
          </label>
          <div id="box_motivo_complemento" class="mt-3 hidden">
            <label class="block text-xs font-semibold text-stone-600 mb-1">Motivo do Complemento *</label>
            <input type="text" id="motivo_complemento" placeholder="Ex: DEPENDENTE QUE NÃO HAVIA SIDO INCLUÍDO ANTERIORMENTE" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-[#2c3b2c] focus:outline-none">
          </div>
        </div>

        <!-- 1. IDENTIFICAÇÃO -->
        <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase flex items-center gap-2">
            <i data-lucide="user" class="w-4 h-4 text-[#c6b075]"></i> 1. Identificação
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="lg:col-span-1">
              <label class="block text-xs font-semibold text-stone-600 mb-1">Posto/Graduação *</label>
              <select id="posto" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#2c3b2c] bg-white">
                <option value="">Selecione...</option>
                <option value="Ten Cel">Ten Cel</option>
                <option value="Maj">Maj</option>
                <option value="Cap">Cap</option>
                <option value="1º Ten">1º Ten</option>
                <option value="2º Ten">2º Ten</option>
                <option value="Asp">Asp</option>
                <option value="S Ten">S Ten</option>
                <option value="1º Sgt">1º Sgt</option>
                <option value="2º Sgt">2º Sgt</option>
                <option value="3º Sgt">3º Sgt</option>
                <option value="Cb">Cb</option>
                <option value="Sd">Sd</option>
              </select>
            </div>
            <div class="sm:col-span-1 lg:col-span-3">
              <label class="block text-xs font-semibold text-stone-600 mb-1">Nome Completo *</label>
              <input type="text" id="nome" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase">
            </div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">CPF *</label><input type="text" id="cpf" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Identidade *</label><input type="text" id="idt" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Prec CP *</label><input type="text" id="preccp" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Telefone *</label><input type="text" id="telefone" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
          </div>
        </div>

        <!-- 2. DADOS DO CURSO -->
        <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase flex items-center gap-2">
            <i data-lucide="book-open" class="w-4 h-4 text-[#c6b075]"></i> 2. Curso e Destino
          </h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2"><label class="block text-xs font-semibold text-stone-600 mb-1">Nome do Curso *</label><input type="text" id="curso" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">OM de Realização *</label><input type="text" id="omCurso" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Guarnição *</label><input type="text" id="guarnicaoCurso" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Adt DCEM *</label><input type="text" id="adtDcem" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Previsão de Desligamento *</label><input type="text" id="dataDesligamento" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
          </div>
        </div>

        <!-- 3. BANCÁRIOS E DEPENDENTES (Padronizado) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
            <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase flex items-center gap-2"><i data-lucide="wallet" class="w-4 h-4 text-[#c6b075]"></i> Dados Bancários</h2>
            <div class="space-y-3">
              <div><label class="block text-xs font-semibold text-stone-600 mb-1">Banco *</label><input type="text" id="banco" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
              <div class="flex gap-3">
                <div class="flex-1"><label class="block text-xs font-semibold text-stone-600 mb-1">Agência *</label><input type="text" id="agencia" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
                <div class="flex-1"><label class="block text-xs font-semibold text-stone-600 mb-1">Conta *</label><input type="text" id="conta" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
              </div>
            </div>
          </div>

          <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
            <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-[#c6b075]"></i> Dependentes</h2>
            <span class="block text-sm font-semibold text-stone-700 mb-2">Possui dependentes?</span>
            <div class="flex gap-4 mb-4">
              <label class="flex items-center gap-2"><input type="radio" id="opt_dep_sim" name="opt_dependentes" value="sim" class="w-4 h-4" onchange="toggleDependentes('sim')"><span class="text-sm font-medium">SIM</span></label>
              <label class="flex items-center gap-2"><input type="radio" id="opt_dep_nao" name="opt_dependentes" value="nao" checked class="w-4 h-4" onchange="toggleDependentes('nao')"><span class="text-sm font-medium">NÃO</span></label>
            </div>
            <div id="caixa-inclusao-dependentes" class="hidden">
              <button type="button" id="btn-add-dep" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-800 px-3 py-1.5 rounded-lg font-semibold w-full mb-3">+ Adicionar Dependente</button>
              <div id="lista-dependentes" class="space-y-3"></div>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-[#2c3b2c] hover:bg-[#1a241a] text-[#c6b075] font-bold py-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-lg border border-[#445646]">
          <i data-lucide="check-circle" class="w-6 h-6"></i> Gerar Documentos (Curso)
        </button>
      </form>
    </div>
  </main>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
    function toggleDependentes(opcao) {
      document.getElementById('caixa-inclusao-dependentes').style.display = (opcao === 'sim') ? 'block' : 'none';
    }
    function toggleMotivoComplemento() {
      const isChecked = document.getElementById('chk_is_complemento').checked;
      const box = document.getElementById('box_motivo_complemento');
      const input = document.getElementById('motivo_complemento');
      box.style.display = isChecked ? 'block' : 'none';
      if(isChecked) input.setAttribute('required', 'required');
      else input.removeAttribute('required');
    }
  </script>
  <script src="./js/gerador-cursos.js"></script>
</body>
</html>
