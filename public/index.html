<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SisDoc Adm - Menu Principal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen flex flex-col">

  <!-- Cabeçalho -->
  <header class="bg-[#1e231b] text-white border-b-4 border-[#c99700] shadow-md sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-[#4B5320] flex items-center justify-center border-2 border-[#c99700]">
          <i data-lucide="shield" class="w-6 h-6 text-[#f4c430]"></i>
        </div>
        <div>
          <span class="text-xs tracking-wider uppercase text-stone-300 font-medium block">5º BIL - Regimento Itororó</span>
          <h1 class="text-lg font-bold text-white tracking-wide">SisDoc Adm Indenizações</h1>
        </div>
      </div>
    </div>
  </header>

  <!-- Menu de Seleção -->
  <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-sm border border-stone-200 p-6 sm:p-10 text-center">
      <h2 class="text-2xl font-bold text-stone-800 mb-2">Requerimento Eletrônico</h2>
      <p class="text-stone-500 mb-10">Selecione a modalidade da sua solicitação para iniciar o preenchimento.</p>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 text-left">
        
        <!-- MÓDULO 1: Bagagem (Ativo) -->
        <a href="bagagem-pnr.html" class="relative flex flex-col items-start p-6 rounded-xl border-2 border-stone-200 hover:border-[#4B5320] hover:bg-stone-50 transition-all text-left group cursor-pointer shadow-sm hover:shadow-md">
          <div class="p-3 bg-stone-100 rounded-lg text-[#4B5320] group-hover:bg-[#4B5320] group-hover:text-white transition mb-4">
            <i data-lucide="package" class="w-7 h-7"></i>
          </div>
          <span class="block text-lg font-bold text-stone-900 mb-1">Bagagem na Mesma Sede</span>
          <span class="block text-sm text-stone-500">Ocupação ou desocupação de PNR</span>
        </a>

        <!-- MÓDULO 2: Transferência (Futuro) -->
        <button onclick="alert('Módulo em desenvolvimento. Estará disponível na próxima etapa!')" class="relative flex flex-col items-start p-6 rounded-xl border-2 border-stone-100 bg-stone-50 text-left opacity-75 cursor-not-allowed">
          <div class="p-3 bg-stone-200 rounded-lg text-stone-400 mb-4">
            <i data-lucide="truck" class="w-7 h-7"></i>
          </div>
          <span class="block text-lg font-bold text-stone-700 mb-1">Transferência</span>
          <span class="block text-sm text-stone-500">Movimentação por necessidade do serviço</span>
        </button>

        <!-- MÓDULO 3: Cursos (Futuro) -->
        <button onclick="alert('Módulo em desenvolvimento. Estará disponível na próxima etapa!')" class="relative flex flex-col items-start p-6 rounded-xl border-2 border-stone-100 bg-stone-50 text-left opacity-75 cursor-not-allowed">
          <div class="p-3 bg-stone-200 rounded-lg text-stone-400 mb-4">
            <i data-lucide="graduation-cap" class="w-7 h-7"></i>
          </div>
          <span class="block text-lg font-bold text-stone-700 mb-1">Cursos e Estágios</span>
          <span class="block text-sm text-stone-500">Aperfeiçoamento ou especialização</span>
        </button>

      </div>
    </div>
  </main>

  <!-- Rodapé -->
  <footer class="bg-stone-900 text-stone-400 py-6 text-xs text-center mt-auto">
    <p class="font-semibold text-stone-300">5º BATALHÃO DE INFANTARIA LEVE &bull; REGIMENTO ITORORÓ</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
