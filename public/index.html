<form onsubmit="handleAdminLogin(event)" autocomplete="off" class="p-6 space-y-4">
  <div>
    <label class="block text-xs font-semibold text-stone-700 mb-1">Usuário *</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
        <i data-lucide="user" class="w-4 h-4"></i>
      </span>
      <input 
        type="text" 
        id="admin-user-input" 
        name="username_admin"
        required 
        autocomplete="new-password"
        placeholder="Digite o usuário" 
        value="" 
        class="w-full pl-9 rounded-lg border-stone-300 border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-eb-olive">
    </div>
  </div>

  <div>
    <label class="block text-xs font-semibold text-stone-700 mb-1">Senha *</label>
    <div class="relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
        <i data-lucide="key-round" class="w-4 h-4"></i>
      </span>
      <input 
        type="password" 
        id="admin-pass-input" 
        name="password_admin"
        required 
        autocomplete="new-password"
        placeholder="Digite a senha" 
        value="" 
        class="w-full pl-9 rounded-lg border-stone-300 border px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-eb-olive">
    </div>
  </div>

  <div id="login-error-msg" class="hidden text-xs font-semibold text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200">
    Usuário ou senha inválidos. Verifique as credenciais.
  </div>

  <button type="submit" class="w-full py-2.5 rounded-lg bg-eb-olive hover:bg-eb-darkOlive text-white text-sm font-bold shadow transition flex items-center justify-center gap-2">
    <i data-lucide="log-in" class="w-4 h-4"></i> Acessar Painel
  </button>
</form>
