<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Indenizações e Documentos Administrativos - EB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { eb: { olive: '#4B5320', darkOlive: '#353c15', gold: '#c99700', goldLight: '#f4c430', dark: '#1e231b' } } } } }
  </script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen flex flex-col">
  <header class="bg-eb-dark text-white border-b-4 border-eb-gold shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-16">
      <div class="flex items-center space-x-3">
        <div><h1 class="text-lg font-bold">SisDoc Adm Indenizações</h1></div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="nav-btn-militar" onclick="switchView('militar')" class="nav-tab px-3 py-2 bg-eb-olive text-white rounded font-bold">Área do Militar</button>
        <button id="nav-btn-admin" onclick="switchView('admin')" class="nav-tab px-3 py-2 text-stone-300 hover:text-white font-bold">Administrador</button>
      </div>
    </div>
  </header>

  <div id="loading-overlay" class="fixed inset-0 z-50 bg-black/60 hidden flex flex-col items-center justify-center text-white">
    <div class="w-10 h-10 border-4 border-eb-gold border-t-transparent rounded-full animate-spin mb-4"></div>
    <p id="loading-overlay-msg" class="text-sm font-bold">Processando...</p>
  </div>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
    <section id="view-militar" class="space-y-6">
      <form id="form-solicitacao" onsubmit="handleSalvarSolicitacao(event)" class="bg-white p-6 rounded-xl shadow-sm border border-stone-200 space-y-4">
        
        <div>
          <h3 class="font-bold text-stone-800 border-b pb-2 mb-3">1. Modalidade e Identificação</h3>
          <select name="modalidade" class="w-full border p-2 rounded mb-3 bg-stone-50">
            <option value="movimentacao">Movimentação / Transferência</option>
            <option value="transporte_pnr">Transporte de Bagagem Mesma Sede (PNR)</option>
            <option value="curso">Curso</option>
          </select>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" name="posto" required placeholder="Posto/Grad (Ex: 1º Sgt)" class="border p-2 rounded">
            <input type="text" name="nomeCompleto" required placeholder="Nome Completo" class="border p-2 rounded uppercase">
            <input type="text" name="idtMilitar" required placeholder="Identidade Militar" class="border p-2 rounded">
            <input type="text" name="cpf" required placeholder="CPF (Apenas números)" class="border p-2 rounded">
          </div>
        </div>

        <div>
          <h3 class="font-bold text-stone-800 border-b pb-2 mb-3">2. Movimentação</h3>
          <div class="grid grid-cols-2 gap-3">
            <input type="text" name="omOrigem" required placeholder="OM Origem" value="5º BIL" class="border p-2 rounded">
            <input type="text" name="omDestino" required placeholder="OM Destino" class="border p-2 rounded">
            <input type="text" name="documentoAutorizador" required placeholder="Documento Autorizador (Ex: Bol DGP 088)" class="border p-2 rounded col-span-2">
          </div>
        </div>

        <button type="submit" class="w-full bg-eb-olive text-white font-bold py-3 rounded hover:bg-eb-darkOlive">
          Gerar Documentos e Enviar
        </button>
      </form>
    </section>

    <section id="view-admin" class="hidden space-y-6">
      <div id="admin-login-card" class="bg-white p-6 rounded-xl shadow-sm max-w-md mx-auto">
        <h2 class="font-bold mb-4">Login Admin</h2>
        <input type="text" id="admin-user-input" placeholder="Usuário" class="w-full border p-2 rounded mb-3">
        <input type="password" id="admin-pass-input" placeholder="Senha" class="w-full border p-2 rounded mb-3">
        <button onclick="handleAdminLogin()" class="w-full bg-eb-olive text-white p-2 rounded font-bold">Entrar</button>
      </div>

      <div id="admin-dashboard-panel" class="hidden bg-white p-6 rounded-xl shadow-sm">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-bold">Painel de Processos</h2>
          <button onclick="recarregarTabelaServidor()" class="bg-stone-200 px-3 py-1 rounded">Atualizar Lista</button>
        </div>
        <table class="w-full text-left text-xs border">
          <thead class="bg-stone-100">
            <tr><th class="p-2">ID / Nome</th><th class="p-2">Destino</th><th class="p-2">Documentos</th></tr>
          </thead>
          <tbody id="tabela-solicitacoes-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    function switchView(view) {
      document.getElementById('view-militar').classList.toggle('hidden', view !== 'militar');
      document.getElementById('view-admin').classList.toggle('hidden', view !== 'admin');
    }

    async function subirArquivoParaVercel(blob, nomeArquivo) {
      const res = await fetch(`/api/upload?filename=${encodeURIComponent(nomeArquivo)}`, { method: 'POST', body: blob });
      if (!res.ok) throw new Error(`Upload recusado pelo servidor. Status: ${res.status}`);
      const data = await res.json();
      return data.url;
    }

    async function handleSalvarSolicitacao(e) {
      e.preventDefault();
      const form = document.getElementById('form-solicitacao');
      const fd = new FormData(form);
      const overlay = document.getElementById('loading-overlay');
      const overlayMsg = document.getElementById('loading-overlay-msg');
      overlay.classList.remove('hidden');

      try {
        const sol = {
          id: 'REQ-' + Date.now().toString().slice(-6),
          dataCriacao: new Date().toLocaleDateString('pt-BR'),
          modalidade: fd.get('modalidade'),
          posto: fd.get('posto'),
          nomeCompleto: fd.get('nomeCompleto').toUpperCase(),
          cpf: fd.get('cpf'),
          idtMilitar: fd.get('idtMilitar'),
          omOrigem: fd.get('omOrigem'),
          omDestino: fd.get('omDestino'),
          documentoAutorizador: fd.get('documentoAutorizador')
        };

        // Geração dos Blobs (Simplificada para evitar erros locais)
        overlayMsg.textContent = 'Gerando PDF...';
        const docPdf = new window.jspdf.jsPDF();
        docPdf.text(`Checklist Indenizacoes - ${sol.nomeCompleto}`, 10, 10);
        const blobPdf = docPdf.output('blob');

        overlayMsg.textContent = 'Gerando Word...';
        const { Document, Packer, Paragraph, TextRun } = docx;
        const docWord = new Document({
          sections: [{ children: [new Paragraph({ children: [new TextRun({ text: `DIEx de: ${sol.nomeCompleto}`, bold: true })] })] }]
        });
        const blobWord = await Packer.toBlob(docWord);

        // Uploads
        overlayMsg.textContent = 'Enviando arquivos...';
        const urlPdf = await subirArquivoParaVercel(blobPdf, `Checklist_${sol.id}.pdf`);
        const urlWord = await subirArquivoParaVercel(blobWord, `DIEx_${sol.id}.docx`);

        // Salvar BD
        overlayMsg.textContent = 'Salvando no banco de dados...';
        const res = await fetch('/api/solicitacoes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...sol, urlPdfDocs: urlPdf, urlDiex: urlWord })
        });

        if (!res.ok) throw new Error('Falha ao gravar no Banco de Dados');

        overlay.classList.add('hidden');
        alert(`SUCESSO!\nSua solicitação ${sol.id} foi salva. Procure a Divisão Administrativa.`);
        form.reset();

      } catch (err) {
        overlay.classList.add('hidden');
        alert("⚠️ ERRO DETALHADO:\n" + err.message + "\n\nSe o erro persistir, tire um print desta tela.");
        console.error(err);
      }
    }

    async function handleAdminLogin() {
      const u = document.getElementById('admin-user-input').value;
      const s = document.getElementById('admin-pass-input').value;
      const res = await fetch('/api/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({usuario:u, senha:s}) });
      const data = await res.json();
      if(data.success) {
        sessionStorage.setItem('sisdoc_admin_token', data.token);
        document.getElementById('admin-login-card').classList.add('hidden');
        document.getElementById('admin-dashboard-panel').classList.remove('hidden');
        recarregarTabelaServidor();
      } else alert('Login inválido');
    }

    async function recarregarTabelaServidor() {
      const token = sessionStorage.getItem('sisdoc_admin_token');
      const res = await fetch('/api/solicitacoes', { headers: { 'Authorization': `Bearer ${token}` } });
      const dados = await res.json();
      const tbody = document.getElementById('tabela-solicitacoes-body');
      tbody.innerHTML = '';
      dados.forEach(d => {
        tbody.innerHTML += `<tr><td class="p-2">${d.id}<br/><b>${d.nomeCompleto}</b></td><td class="p-2">${d.omDestino}</td><td class="p-2"><a href="${d.urlPdfDocs}" target="_blank" class="bg-rose-600 text-white px-2 py-1 rounded">PDF</a> <a href="${d.urlDiex}" target="_blank" class="bg-eb-olive text-white px-2 py-1 rounded">Word</a></td></tr>`;
      });
    }
  </script>
</body>
</html>
