<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movimentação - SisDoc</title>
  <script src="https://unpkg.com/pizzip@3.1.4/dist/pizzip.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.37.11/docxtemplater.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #eae6dd; }
    .font-serif-title { font-family: 'Playfair Display', Georgia, serif; }
  </style>
</head>
<body class="text-stone-800 min-h-screen flex flex-col">

  <header class="bg-[#2c3b2c] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <div class="flex items-center gap-3">
        <i data-lucide="shield" class="w-8 h-8 text-[#c6b075]"></i>
        <div class="flex flex-col justify-center">
          <span class="text-[10px] text-[#a0a89d] uppercase tracking-wider mb-[2px]">5º BIL - SisDoc</span>
          <h1 class="text-base sm:text-lg font-bold tracking-wide text-white leading-none">Movimentação (Transferência)</h1>
        </div>
      </div>
      <a href="index.html" class="p-2 bg-[#1a241a] border border-[#445646] rounded hover:bg-[#3b4d3d] transition flex items-center gap-1 text-sm font-semibold text-[#c6b075]">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
      </a>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
    <div class="bg-[#fbfaf6] rounded-xl shadow-lg border border-[#dcd3b6] overflow-hidden">
      <form id="form-movimentacao" class="p-6 sm:p-8 space-y-6">
        
        <!-- TIPO DE SOLICITAÇÃO -->
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-5 shadow-sm">
          <label class="flex items-center gap-2 cursor-pointer font-bold text-amber-900">
            <input type="checkbox" id="chk_is_complemento" class="w-5 h-5 text-amber-600 focus:ring-amber-500 rounded border-amber-300" onchange="toggleMotivoComplemento()">
            Esta é uma solicitação de COMPLEMENTO DE INDENIZAÇÃO
          </label>
          <div id="box_motivo_complemento" class="mt-3 hidden">
            <label class="block text-xs font-semibold text-stone-600 mb-1">Motivo do Complemento *</label>
            <input type="text" id="motivo_complemento" placeholder="Ex: TRANSPORTE DE VEÍCULO NÃO INCLUÍDO ANTERIORMENTE" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-[#2c3b2c] focus:outline-none">
          </div>
        </div>

        <!-- 1. DADOS BÁSICOS -->
        <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">1. Identificação</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="lg:col-span-1">
              <label class="block text-xs font-semibold text-stone-600 mb-1">Posto/Graduação *</label>
              <select id="posto" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm bg-white">
                <option value="">Selecione...</option>
                <option value="Ten Cel">Ten Cel</option>
                <option value="Maj">Maj</option>
                <option value="Cap">Cap</option>
                <option value="1º Ten">1º Ten</option>
                <option value="2º Ten">2º Ten</option>
                <option value="Asp">Asp</option>
                <option value="S Ten">S Ten</option>
                <option value="1º Sgt">1º Sgt</option>
                <option value="2º Sgt">2º Sgt</option>
                <option value="3º Sgt">3º Sgt</option>
                <option value="Cb">Cb</option>
                <option value="Sd">Sd</option>
              </select>
            </div>
            <div class="sm:col-span-1 lg:col-span-3">
              <label class="block text-xs font-semibold text-stone-600 mb-1">Nome Completo *</label>
              <input type="text" id="nome" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase">
            </div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">CPF *</label><input type="text" id="cpf" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Identidade *</label><input type="text" id="idt" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Prec CP *</label><input type="text" id="preccp" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Telefone *</label><input type="text" id="telefone" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
          </div>
        </div>

        <!-- 2. MOVIMENTAÇÃO -->
        <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">2. Dados da Movimentação</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">OM de Destino *</label><input type="text" id="omDestino" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Guarnição de Destino *</label><input type="text" id="guarnicao" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Cidade onde Reside (Atual) *</label><input type="text" id="cidadeReside" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Cidade onde Residirá *</label><input type="text" id="cidadeDestino" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Adt DCEM *</label><input type="text" id="adtDcem" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
            <div><label class="block text-xs font-semibold text-stone-600 mb-1">Data Prev. Desligamento *</label><input type="text" id="dataDesligamento" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
          </div>
        </div>

        <!-- 3. INDENIZAÇÕES -->
        <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">3. Opções de Indenização</h2>
          <div class="grid grid-cols-2 sm:grid-cols-5 gap-4">
            <label class="flex flex-col items-center gap-1 p-2 border rounded-lg cursor-pointer hover:bg-stone-50"><span class="text-xs font-semibold">Automóvel</span><input type="checkbox" id="chk_auto" class="w-5 h-5 text-[#2c3b2c]"></label>
            <label class="flex flex-col items-center gap-1 p-2 border rounded-lg cursor-pointer hover:bg-stone-50"><span class="text-xs font-semibold">Motocicleta</span><input type="checkbox" id="chk_moto" class="w-5 h-5 text-[#2c3b2c]"></label>
            <label class="flex flex-col items-center gap-1 p-2 border rounded-lg cursor-pointer hover:bg-stone-50"><span class="text-xs font-semibold">Bagagem</span><input type="checkbox" id="chk_bagagem" checked class="w-5 h-5 text-[#2c3b2c]"></label>
            <label class="flex flex-col items-center gap-1 p-2 border rounded-lg cursor-pointer hover:bg-stone-50"><span class="text-xs font-semibold">Passagens</span><input type="checkbox" id="chk_passagens" checked class="w-5 h-5 text-[#2c3b2c]"></label>
            <label class="flex flex-col items-center gap-1 p-2 border rounded-lg cursor-pointer hover:bg-stone-50"><span class="text-xs font-semibold">Ajuda de Custo</span><input type="checkbox" id="chk_ajuda" checked class="w-5 h-5 text-[#2c3b2c]"></label>
          </div>
        </div>

        <!-- 4. DEPENDENTES E BANCO -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
            <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">Dados Bancários</h2>
            <div class="space-y-3">
              <div><label class="block text-xs font-semibold text-stone-600 mb-1">Banco *</label><input type="text" id="banco" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
              <div class="flex gap-3">
                <div class="flex-1"><label class="block text-xs font-semibold text-stone-600 mb-1">Agência *</label><input type="text" id="agencia" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
                <div class="flex-1"><label class="block text-xs font-semibold text-stone-600 mb-1">Conta *</label><input type="text" id="conta" required class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm"></div>
              </div>
            </div>
          </div>
          
          <div class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm">
            <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">Dependentes</h2>
            <span class="block text-sm font-semibold text-stone-700 mb-2">Possui dependentes?</span>
            <div class="flex gap-4 mb-4">
              <label class="flex items-center gap-2"><input type="radio" id="opt_dep_sim" name="opt_dependentes" value="sim" class="w-4 h-4" onchange="toggleDependentesMov()"><span class="text-sm font-medium">SIM</span></label>
              <label class="flex items-center gap-2"><input type="radio" id="opt_dep_nao" name="opt_dependentes" value="nao" checked class="w-4 h-4" onchange="toggleDependentesMov()"><span class="text-sm font-medium">NÃO</span></label>
            </div>
            <div id="caixa-inclusao-dependentes" class="hidden">
              <span class="block text-xs font-semibold text-stone-700 mb-2">Eles acompanharão o militar?</span>
              <div class="flex gap-4 mb-4">
                <label class="flex items-center gap-2"><input type="radio" id="opt_acomp_sim" name="opt_dep_acompanham" value="sim" checked class="w-4 h-4"><span class="text-xs font-medium">SIM</span></label>
                <label class="flex items-center gap-2"><input type="radio" id="opt_acomp_nao" name="opt_dep_acompanham" value="nao" class="w-4 h-4"><span class="text-xs font-medium">NÃO</span></label>
              </div>
              <button type="button" id="btn-add-dep" class="text-xs bg-stone-200 hover:bg-stone-300 text-stone-800 px-3 py-1.5 rounded-lg font-semibold w-full mb-3">+ Adicionar Dependente</button>
              <div id="lista-dependentes" class="space-y-3"></div>
            </div>
          </div>
        </div>

        <!-- 5. VEÍCULOS -->
        <div id="box-veiculos" class="bg-white border border-[#dcd3b6] rounded-xl p-5 shadow-sm hidden">
          <h2 class="text-sm font-bold text-[#2c3b2c] border-b border-[#dcd3b6] pb-2 mb-4 uppercase">Dados dos Veículos</h2>
          
          <div id="box-dados-auto" class="hidden mb-4">
            <h3 class="text-xs font-bold bg-stone-100 p-2 rounded mb-2">AUTOMÓVEL</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div><input type="text" id="auto_modelo" placeholder="Marca / Modelo" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="auto_cor" placeholder="Cor" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="auto_placa" placeholder="Placa" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="auto_ano" placeholder="Ano / Modelo" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            </div>
          </div>

          <div id="box-dados-moto" class="hidden">
            <h3 class="text-xs font-bold bg-stone-100 p-2 rounded mb-2">MOTOCICLETA</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div><input type="text" id="moto_modelo" placeholder="Marca / Modelo" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="moto_cor" placeholder="Cor" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="moto_placa" placeholder="Placa" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
              <div><input type="text" id="moto_ano" placeholder="Ano / Modelo" class="w-full border border-stone-300 rounded-lg px-3 py-2 text-sm uppercase"></div>
            </div>
          </div>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-[#2c3b2c] hover:bg-[#1a241a] text-[#c6b075] font-bold py-4 rounded-lg shadow-md transition flex items-center justify-center gap-2 text-lg border border-[#445646]">
          <i data-lucide="check-circle" class="w-6 h-6"></i> Gerar Documentos (Movimentação)
        </button>
      </form>
    </div>
  </main>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
    function toggleMotivoComplemento() {
      const isChecked = document.getElementById('chk_is_complemento').checked;
      const box = document.getElementById('box_motivo_complemento');
      const input = document.getElementById('motivo_complemento');
      box.style.display = isChecked ? 'block' : 'none';
      if(isChecked) input.setAttribute('required', 'required');
      else input.removeAttribute('required');
    }
    function toggleDependentesMov() {
      const isSim = document.getElementById('opt_dep_sim').checked;
      document.getElementById('caixa-inclusao-dependentes').style.display = isSim ? 'block' : 'none';
    }
    // Mostra as divs de veículos se algum for marcado
    const chkAuto = document.getElementById('chk_auto');
    const chkMoto = document.getElementById('chk_moto');
    const boxVeiculos = document.getElementById('box-veiculos');
    const boxAuto = document.getElementById('box-dados-auto');
    const boxMoto = document.getElementById('box-dados-moto');

    function checkVeiculos() {
      boxVeiculos.style.display = (chkAuto.checked || chkMoto.checked) ? 'block' : 'none';
      boxAuto.style.display = chkAuto.checked ? 'block' : 'none';
      boxMoto.style.display = chkMoto.checked ? 'block' : 'none';
    }
    chkAuto.addEventListener('change', checkVeiculos);
    chkMoto.addEventListener('change', checkVeiculos);
  </script>
  <script src="./js/gerador-movimentacao.js"></script>
</body>
</html>
