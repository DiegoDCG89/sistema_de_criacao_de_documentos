<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SisDoc - Vistoria PNR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/sisdoc.css">
</head>
<body class="bg-gray-50 min-h-screen p-8">
  <div class="max-w-4xl mx-auto bg-white p-8 shadow-md rounded-lg">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Termo de Vistoria de PNR</h1>
    
    <form id="formVistoria" class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Tipo de Vistoria</label>
          <select id="tipoVistoria" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border">
            <option value="OCUPACAO">Ocupação</option>
            <option value="DESOCUPACAO">Desocupação</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Data da Vistoria</label>
          <input type="date" id="dataVistoria" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border">
        </div>
      </div>
    
       <div class="secao-form">
          <h3 class="secao-titulo"><span class="secao-numero">1</span> Identificação do Militar</h3>
          <div class="grid grid-cols-1 sm:grid-cols-3 lg:grid-cols-4 gap-4">
            <div>
              <label class="rotulo rotulo-obrigatorio">Posto / Graduação</label>
              <select id="posto" required class="campo-select">
                <option value="">Selecione...</option>
                <option value="Gen Ex">Gen Ex</option>
                <option value="Gen Div">Gen Div</option>
                <option value="Gen Bda">Gen Bda</option>
                <option value="Cel">Cel</option>
                <option value="Ten Cel">Ten Cel</option>
                <option value="Maj">Maj</option>
                <option value="Cap">Cap</option>
                <option value="1º Ten">1º Ten</option>
                <option value="2º Ten">2º Ten</option>
                <option value="Asp">Asp</option>
                <option value="S Ten">S Ten</option>
                <option value="Cad">Cad</option>
                <option value="1º Sgt">1º Sgt</option>
                <option value="2º Sgt">2º Sgt</option>
                <option value="3º Sgt">3º Sgt</option>
                <option value="Cb">Cb</option>
                <option value="Sd">Sd</option>
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="rotulo rotulo-obrigatorio">Nome Completo</label>
              <input type="text" id="nomeMilitar" placeholder="Fulano de Tal" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 border">
            </div>
           <div>
  <label for="enderecoPNR" class="rotulo rotulo-obrigatorio">
    Número do PNR
  </label>

  <select id="enderecoPNR" name="enderecoPNR" required class="campo-select">
    <option value="">Selecione o PNR...</option>

    <optgroup label="Av. Mal Argolo">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6VII">6</option>
      <option value="7">7</option>
      <option value="8">8</option>
      <option value="9">9</option>
      <option value="10">10</option>
      <option value="11">11</option>
      <option value="12VII">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15VII">15</option>
      <option value="16">16</option>
      <option value="17">17</option>
      <option value="18">18</option>
      <option value="60">60</option>
    </optgroup>

    <optgroup label="R. Dr. José Machado Coelho de Castro">
      <option value="93">93</option>
      <option value="113">113</option>
      <option value="133">133</option>
      <option value="145">145</option>
      <option value="163">163</option>
      <option value="175">175</option>
      <option value="195">195</option>
    </optgroup>

    <optgroup label="R. Sgt Camargo">
      <option value="53">53</option>
      <option value="65">65</option>
    </optgroup>
  </select>
</div>

      <div class="mt-8">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-medium">Itens Vistoriados</h3>
            <button type="button" onclick="adicionarLinha()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 text-sm">
                + Adicionar Item
            </button>
        </div>
        
        <table class="w-full border-collapse border border-gray-300" id="tabelaItens">
          <thead class="bg-gray-100">
            <tr>
              <th class="border border-gray-300 p-2 text-left">Cômodo / Item</th>
              <th class="border border-gray-300 p-2 text-left">Estado de Conservação</th>
              <th class="border border-gray-300 p-2 text-center w-24">Ação</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="border border-gray-300 p-2"><input type="text" class="item-nome w-full p-1" value="Sala - Pintura" required></td>
              <td class="border border-gray-300 p-2"><input type="text" class="item-estado w-full p-1" value="Bom" required></td>
              <td class="border border-gray-300 p-2 text-center"><button type="button" onclick="removerLinha(this)" class="text-red-600 hover:text-red-800 font-bold">X</button></td>
            </tr>
            <tr>
              <td class="border border-gray-300 p-2"><input type="text" class="item-nome w-full p-1" value="Quarto 1 - Portas e Maçanetas" required></td>
              <td class="border border-gray-300 p-2"><input type="text" class="item-estado w-full p-1" value="Com avarias" required></td>
              <td class="border border-gray-300 p-2 text-center"><button type="button" onclick="removerLinha(this)" class="text-red-600 hover:text-red-800 font-bold">X</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="flex justify-end pt-4">
        <button type="submit" class="bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg font-bold hover:bg-green-700 transition">
          Gerar e Salvar no Drive
        </button>
      </div>
    </form>
  </div>

  <script>
    function adicionarLinha() {
      const tbody = document.querySelector('#tabelaItens tbody');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="border border-gray-300 p-2"><input type="text" class="item-nome w-full p-1" placeholder="Ex: Cozinha - Piso" required></td>
        <td class="border border-gray-300 p-2"><input type="text" class="item-estado w-full p-1" placeholder="Ex: Bom" required></td>
        <td class="border border-gray-300 p-2 text-center"><button type="button" onclick="removerLinha(this)" class="text-red-600 hover:text-red-800 font-bold">X</button></td>
      `;
      tbody.appendChild(tr);
    }

    function removerLinha(btn) {
      if (document.querySelectorAll('#tabelaItens tbody tr').length > 1) {
        btn.closest('tr').remove();
      } else {
        alert("O termo precisa ter pelo menos um item.");
      }
    }

    document.getElementById('formVistoria').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Montar objeto de dados
      const dados = {
        tipoVistoria: document.getElementById('tipoVistoria').value,
        dataVistoria: document.getElementById('dataVistoria').value.split('-').reverse().join('/'), // Formata DD/MM/AAAA
        nomeMilitar: document.getElementById('nomeMilitar').value,
        enderecoPNR: document.getElementById('enderecoPNR').value,
        posto: document.getElementById('posto').value,
        itens: Array.from(document.querySelectorAll('#tabelaItens tbody tr')).map(linha => ({
          nome: linha.querySelector('.item-nome').value,
          estado: linha.querySelector('.item-estado').value
        }))
      };

      try {
        const response = await fetch('/gerar-termo-vistoria', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados)
        });

        const result = await response.json();
        if (response.ok) {
          alert('Sucesso! Documento salvo na pasta PNR no Google Drive.');
          if(result.downloadUrl) window.open(result.downloadUrl, '_blank');
        } else {
          alert('Erro: ' + result.error);
        }
      } catch (error) {
        alert('Falha na comunicação com o servidor.');
        
      }
    });
  </script>
</body>
</html>
